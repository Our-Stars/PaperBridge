[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperbridge"
version = "0.1.0"
description = "CLI-first academic paper PDF structured conversion tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24.0",
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "pytest>=8.0.0",
  "python-docx>=1.1.0",
  "typer>=0.12.0",
]

[project.scripts]
paperbridge = "paperbridge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paperbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
