[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperbridge"
version = "0.1.0"
description = "CLI-first academic paper PDF structured conversion tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "PaperBridge Contributors" },
]
keywords = ["pdf", "academic-paper", "paper", "structured-conversion", "markdown", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing",
  "Topic :: Text Processing :: Markup",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
]
dependencies = [
  "PyMuPDF>=1.24.0",
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "pytest>=8.0.0",
  "python-docx>=1.1.0",
  "typer>=0.12.0",
]

[project.urls]
Repository = "https://github.com/Our-Stars/PaperBridge"

[project.scripts]
paperbridge = "paperbridge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paperbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
